name: Mobil (Flutter) + sunucu testleri

on:
  pull_request:
    paths: ['mobile/**', 'lib/**', 'functions/**', 'tests/**', 'migrations/**', 'index.html', 'docs/tasarim/**', '.github/workflows/mobil.yml']
  push:
    branches: ['mobil/**']
    paths: ['mobile/**', 'lib/**', 'functions/**', 'tests/**', 'migrations/**', 'index.html', 'docs/tasarim/**', '.github/workflows/mobil.yml']

permissions:
  contents: read

env:
  # Bu dalın Preview adresi (test D1'e bağlı). Production adresi hiçbir derlemeye verilmez.
  AKE_API_PREVIEW: https://mobil-magaza-sandbox.akeakademi.pages.dev

concurrency:
  group: mobil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node sunucu testleri (tüm takım)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --version
      - name: node --test tests/*.test.mjs
        run: node --test tests/*.test.mjs

  android:
    name: pub get · analyze · test · Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter sürümü
        run: flutter --version
      - name: Platform klasörlerini üret (kur.sh; flutter pub get dahil)
        run: ./kur.sh
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos   # hata ve uyarılar kırmızı; 'info' (ör. material.dart kullanımdan kalkma notu) değil
      - name: flutter test
        run: flutter test --reporter expanded
      - name: Android debug APK (bu dalın Preview adresiyle; Production'a bağlanmaz)
        run: flutter build apk --debug --dart-define=AKE_API=${{ env.AKE_API_PREVIEW }}
      - name: APK özeti + gömülü API adresi doğrulaması (derleme kaydı)
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-debug.apk
          ls -l "$APK"
          mkdir -p apk-kayit
          unzip -p "$APK" assets/flutter_assets/kernel_blob.bin | strings -n 8 | grep -oE 'https://[A-Za-z0-9.-]+\.(pages\.dev|com)' | sort | uniq -c > apk-kayit/gomulu-adresler.txt || true
          {
            echo "commit: ${GITHUB_SHA}"
            echo "calisma: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "beklenen_api: https://mobil-magaza-sandbox.akeakademi.pages.dev"
            echo "apk_sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo "apk_boyut: $(stat -c %s "$APK")"
            echo "--- APK içinde bulunan https adresleri (adet adres) ---"
            cat apk-kayit/gomulu-adresler.txt
          } | tee apk-kayit/derleme-kaydi.txt
          grep -q 'mobil-magaza-sandbox.akeakademi.pages.dev' apk-kayit/gomulu-adresler.txt || { echo "HATA: beklenen API adresi APK'de yok"; exit 1; }
          if grep -q 'mobil-ake-ilk-surum' apk-kayit/gomulu-adresler.txt; then echo "HATA: eski dal adresi APK'de"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ake-akademi-android-debug-magaza-sandbox
          path: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/apk-kayit/derleme-kaydi.txt
          retention-days: 14

  aab:
    name: Release AAB (Play kapalı test yolu; yükleme anahtarı yoksa İMZASIZ)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform klasörlerini üret (kur.sh; flutter pub get dahil)
        run: ./kur.sh
      - name: Yükleme anahtarı (yalnız GitHub Secrets'ta varsa; değerler loga yazılmaz, repoya girmez)
        id: anahtar
        env:
          KS_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KS_SIFRE: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KS_TAKMA: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KS_ANAHTAR_SIFRE: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set +x
          if [ -n "$KS_B64" ] && [ -n "$KS_SIFRE" ] && [ -n "$KS_TAKMA" ] && [ -n "$KS_ANAHTAR_SIFRE" ]; then
            umask 077
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/yukleme.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/yukleme.jks" "$KS_SIFRE" "$KS_TAKMA" "$KS_ANAHTAR_SIFRE" > android/key.properties
            echo "imzali=evet" >> "$GITHUB_OUTPUT"
            echo "Yükleme anahtarı bulundu: AAB imzalanacak."
          else
            echo "imzali=hayir" >> "$GITHUB_OUTPUT"
            echo "Yükleme anahtarı Secrets'ta YOK: AAB İMZASIZ üretilecek ve Play'e yüklenemez."
          fi
      - name: flutter build appbundle --release (Preview adresiyle; sürüm kodu = çalıştırma numarası)
        run: flutter build appbundle --release --dart-define=AKE_API=${{ env.AKE_API_PREVIEW }} --build-number=${{ github.run_number }}
      - name: AAB doğrulaması (paket kimliği, sürüm kodu, Billing izni, gömülü adres, imza)
        run: |
          mkdir -p aab-kayit
          cp build/app/outputs/bundle/release/app-release.aab aab-kayit/ake-akademi-release.aab
          ./tool/aab_dogrula.sh aab-kayit/ake-akademi-release.aab com.akeakademi.ake_akademi "${{ env.AKE_API_PREVIEW }}" "${{ github.run_number }}" "${{ steps.anahtar.outputs.imzali }}" aab-kayit/aab-kaydi.txt
      - name: Anahtar dosyalarını sil
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/yukleme.jks"
      - uses: actions/upload-artifact@v4
        if: steps.anahtar.outputs.imzali == 'evet'
        with:
          name: ake-akademi-android-release-aab-imzali
          path: |
            mobile/aab-kayit/ake-akademi-release.aab
            mobile/aab-kayit/aab-kaydi.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: steps.anahtar.outputs.imzali != 'evet'
        with:
          name: ake-akademi-android-release-aab-IMZASIZ-play-e-yuklenemez
          path: |
            mobile/aab-kayit/ake-akademi-release.aab
            mobile/aab-kayit/aab-kaydi.txt
          retention-days: 14

  ios:
    name: iOS · macOS derleme + test (imzasız; mağaza/TestFlight değil)
    runs-on: macos-latest
    timeout-minutes: 50
    permissions:
      contents: write   # yalnız iOS kanıt dalını yayınlamak için (kanit/pr43-ios-<sha>); main/Production'a yazılmaz
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform klasörlerini üret (kur.sh; flutter pub get dahil)
        run: ./kur.sh
      - name: flutter test (macOS üzerinde)
        run: flutter test --reporter expanded
      - name: iOS derlemesi (--no-codesign; Preview adresiyle)
        run: flutter build ios --release --no-codesign --dart-define=AKE_API=${{ env.AKE_API_PREVIEW }}
      - name: Derleme özeti
        run: ls -l build/ios/iphoneos/Runner.app | head -5
      - name: iOS simülatöründe ekran yürüyüşü (giriş → alt gezinme → soru akışı → Gelişim/Plan/Ayarlar; test verisi = sahte sunucu)
        run: |
          set -o pipefail
          mkdir -p kanit
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_SIMULATOR $(xcrun simctl list devices | grep "$UDID" | head -1 | sed 's/^ *//')" | tee kanit/ios-cihaz.txt
          flutter drive --no-pub --driver=test_driver/integration_test.dart --target=integration_test/ekranlar_test.dart -d "$UDID" 2>&1 | tee kanit/ios-drive.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-ekranlar
          path: |
            mobile/ekran-kanit/*.png
            mobile/kanit/*
          retention-days: 14
      - name: iOS kanıtını kanıt dalına yayınla (ekran görüntüleri + günlük)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          test -d ekran-kanit || exit 0
          rm -rf /tmp/ioskanit && mkdir -p /tmp/ioskanit/ekranlar && cp ekran-kanit/*.png /tmp/ioskanit/ekranlar/ && cp kanit/ios-* /tmp/ioskanit/ 2>/dev/null || true
          cd /tmp/ioskanit
          git init -q -b "kanit/pr43-ios-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "iOS simülatör ekran kanıtı ${GITHUB_SHA::7} [skip ci]"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/kanit/pr43-ios-${GITHUB_SHA::7}"

  emulator:
    name: Emülatör ekran kanıtı (320/390 dp ekran yürüyüşü + gerçek zamanlı açılış kaydı)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # yalnız kanıt dalını yayınlamak için (kanit/pr43-<sha>); main/Production'a yazılmaz
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform klasörleri (kur.sh)
        run: ./kur.sh
      - name: Gerçek uygulama (release/AOT, Preview adresi) emülatör başlamadan derlenir — emülatörle CPU paylaşıp kaydı bozmasın
        run: |
          flutter build apk --release --dart-define=AKE_API=${{ env.AKE_API_PREVIEW }} --dart-define=AKE_OLCUM=true
          mkdir -p kanit-apk && cp build/app/outputs/flutter-apk/app-release.apk kanit-apk/ake-release.apk
          ls -l kanit-apk
          # release derlemesi dev-bağımlılık eklentilerini (integration_test) kayıttan çıkarır; sürücü derlemesi temiz başlasın
          (cd android && ./gradlew --stop >/dev/null 2>&1 || true)
          flutter clean
          flutter pub get
      - name: KVM ve ffmpeg
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Emülatörde ekran yürüyüşü + açılış kaydı
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: ./mobile
          script: ./tool/emulator_kanit.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ake-emulator-kanit
          path: mobile/kanit
          retention-days: 14
      - name: Kanıtı ayrı dalda yayınla (yalnız push; main/Production'a dokunmaz, [skip ci])
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          test -d kanit || exit 0
          rm -rf /tmp/kanit && mkdir /tmp/kanit && cp -r kanit/. /tmp/kanit/
          cd /tmp/kanit
          git init -q -b "kanit/pr43-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Emülatör ekran kanıtı ${GITHUB_SHA::7} [skip ci]"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/kanit/pr43-${GITHUB_SHA::7}"
