name: Mobil (Flutter) + sunucu testleri

on:
  pull_request:
    paths: ['mobile/**', 'lib/**', 'functions/**', 'tests/**', 'migrations/**', 'index.html', 'docs/tasarim/**', '.github/workflows/mobil.yml']
  push:
    branches: ['mobil/**']
    paths: ['mobile/**', 'lib/**', 'functions/**', 'tests/**', 'migrations/**', 'index.html', 'docs/tasarim/**', '.github/workflows/mobil.yml']

permissions:
  contents: read

concurrency:
  group: mobil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node sunucu testleri (tüm takım)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --version
      - name: node --test tests/*.test.mjs
        run: node --test tests/*.test.mjs

  android:
    name: pub get · analyze · test · Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter sürümü
        run: flutter --version
      - name: Platform klasörlerini üret (kur.sh; flutter pub get dahil)
        run: ./kur.sh
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos   # hata ve uyarılar kırmızı; 'info' (ör. material.dart kullanımdan kalkma notu) değil
      - name: flutter test
        run: flutter test --reporter expanded
      - name: Android debug APK (Preview adresiyle; Production'a bağlanmaz)
        run: flutter build apk --debug --dart-define=AKE_API=https://mobil-ake-ilk-surum.akeakademi.pages.dev
      - name: APK özeti
        run: ls -l build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ake-akademi-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  ios:
    name: iOS · macOS derleme + test (imzasız; mağaza/TestFlight değil)
    runs-on: macos-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform klasörlerini üret (kur.sh; flutter pub get dahil)
        run: ./kur.sh
      - name: flutter test (macOS üzerinde)
        run: flutter test --reporter expanded
      - name: iOS derlemesi (--no-codesign; Preview adresiyle)
        run: flutter build ios --release --no-codesign --dart-define=AKE_API=https://mobil-ake-ilk-surum.akeakademi.pages.dev
      - name: Derleme özeti
        run: ls -l build/ios/iphoneos/Runner.app | head -5
      - name: iOS simülatöründe ekran yürüyüşü (giriş → alt gezinme → soru akışı → Gelişim/Plan/Ayarlar; test verisi = sahte sunucu)
        run: |
          set -o pipefail
          mkdir -p kanit
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_SIMULATOR $(xcrun simctl list devices | grep "$UDID" | head -1 | sed 's/^ *//')" | tee kanit/ios-cihaz.txt
          flutter drive --no-pub --driver=test_driver/integration_test.dart --target=integration_test/ekranlar_test.dart -d "$UDID" 2>&1 | tee kanit/ios-drive.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-ekranlar
          path: |
            mobile/ekran-kanit/*.png
            mobile/kanit/*
          retention-days: 14

  emulator:
    name: Emülatör ekran kanıtı (320/390 dp ekran yürüyüşü + gerçek zamanlı açılış kaydı)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # yalnız kanıt dalını yayınlamak için (kanit/pr43-<sha>); main/Production'a yazılmaz
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform klasörleri (kur.sh)
        run: ./kur.sh
      - name: Gerçek uygulama (release/AOT, Preview adresi) emülatör başlamadan derlenir — emülatörle CPU paylaşıp kaydı bozmasın
        run: |
          flutter build apk --release --dart-define=AKE_API=https://mobil-ake-ilk-surum.akeakademi.pages.dev --dart-define=AKE_OLCUM=true
          mkdir -p kanit-apk && cp build/app/outputs/flutter-apk/app-release.apk kanit-apk/ake-release.apk
          ls -l kanit-apk
          # release derlemesi dev-bağımlılık eklentilerini (integration_test) kayıttan çıkarır; sürücü derlemesi temiz başlasın
          (cd android && ./gradlew --stop >/dev/null 2>&1 || true)
          flutter clean
          flutter pub get
      - name: KVM ve ffmpeg
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Emülatörde ekran yürüyüşü + açılış kaydı
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: ./mobile
          script: ./tool/emulator_kanit.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ake-emulator-kanit
          path: mobile/kanit
          retention-days: 14
      - name: Kanıtı ayrı dalda yayınla (yalnız push; main/Production'a dokunmaz, [skip ci])
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          test -d kanit || exit 0
          rm -rf /tmp/kanit && mkdir /tmp/kanit && cp -r kanit/. /tmp/kanit/
          cd /tmp/kanit
          git init -q -b "kanit/pr43-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Emülatör ekran kanıtı ${GITHUB_SHA::7} [skip ci]"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/kanit/pr43-${GITHUB_SHA::7}"
