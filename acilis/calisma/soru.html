<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e6">
<title>Soru Çözme · AKE Akademi</title>
<link rel="stylesheet" href="../ortak/ortak.css">
<style>
/* Çalışma ekranı: soru merkezde, dikkat dağıtan hareket yok. Masaüstünde sağda cevap kâğıdı, tablette ve telefonda alttan açılan sayfa. */
body{background:var(--krem)}
.ust-cubuk{position:sticky;top:0;z-index:20;background:rgba(245,240,230,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--cizgi);padding-top:env(safe-area-inset-top,0px)}
.ust-cubuk .w{display:flex;align-items:center;gap:12px;min-height:64px}
.baslik-k{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.baslik-k b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.baslik-k span{font-size:14px;color:var(--murekkep3)}
.sure{margin-left:auto;font:700 17px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:.02em;padding:0 6px}
.isaret-b[aria-pressed="true"]{--bg:var(--isaret-z);--fg:var(--isaret);border-color:#e5c58c}
.isaret-b svg{fill:none}.isaret-b[aria-pressed="true"] svg{fill:currentColor}
.ilerleme{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;height:5px;margin:0 auto;max-width:1200px;padding:0 var(--g2) 0 var(--g);transform:translateY(-1px)}
.ilerleme i{border-radius:3px;background:var(--krem2)}
.ilerleme i.c{background:var(--murekkep)}.ilerleme i.d{background:var(--dogru)}.ilerleme i.y{background:var(--yanlis)}.ilerleme i.s{background:var(--mavi)}
.duzen{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:48px;max-width:1200px;margin:0 auto;padding:36px var(--g2) 140px var(--g);align-items:start}
.soru{max-width:720px;width:100%;margin:0 auto}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:15px;color:var(--murekkep3);margin-bottom:18px}
.meta .no{font-weight:700;color:var(--murekkep)}
.meta .zor{padding:4px 9px;border-radius:7px;background:var(--krem2);color:var(--murekkep2);font-size:13.5px;font-weight:600}
.parca{background:var(--yuzey);border-radius:14px;padding:22px 24px;font-size:19px;line-height:1.7;margin:0 0 22px;box-shadow:inset 0 0 0 1px var(--cizgi)}
.kok{font-size:19.5px;line-height:1.6;font-weight:700;margin:0 0 22px;letter-spacing:-.003em}
.secenek{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.secenek button{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) 24px;align-items:center;gap:14px;min-height:60px;padding:10px 16px 10px 12px;text-align:left;border-radius:14px;border:1.5px solid var(--cizgi);background:var(--yuzey);font:400 18px/1.45 var(--sans);color:var(--murekkep);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color var(--hiz) var(--e),background-color var(--hiz) var(--e),box-shadow var(--hiz) var(--e),transform 120ms var(--e)}
.secenek .h{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:700 16px/1 var(--sans);background:var(--krem2);color:var(--murekkep2);transition:background-color var(--hiz),color var(--hiz)}
@media (hover:hover){.secenek button:not(:disabled):hover{border-color:#9fb4ea;background:#fdfcf8}}
.secenek button:active:not(:disabled){transform:scale(.995)}
.secenek button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--krem),0 0 0 5px var(--mavi)}
.secenek button[aria-pressed="true"]{border-color:var(--murekkep);box-shadow:inset 0 0 0 1px var(--murekkep)}
.secenek button[aria-pressed="true"] .h{background:var(--murekkep);color:#fff}
.secenek button.dogru{border-color:var(--dogru);background:var(--dogru-z);box-shadow:none}.secenek button.dogru .h{background:var(--dogru);color:#fff}
.secenek button.yanlis{border-color:var(--yanlis);background:var(--yanlis-z);box-shadow:none}.secenek button.yanlis .h{background:var(--yanlis);color:#fff}
.secenek button:disabled{cursor:default}
.secenek .ik{width:22px;height:22px}
.cozum{margin-top:22px;border-radius:14px;padding:20px 22px;background:var(--yuzey);box-shadow:inset 0 0 0 1px var(--cizgi);display:none}
.cozum.on{display:block}
.cozum .sonuc{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.cozum .sonuc i{width:10px;height:10px;border-radius:50%;background:var(--dogru)}.cozum .sonuc.y i{background:var(--yanlis)}
.cozum p{margin:10px 0 0;font-size:17.5px;line-height:1.65;color:var(--murekkep)}
.cozum .not{font-size:14.5px;color:var(--murekkep3);margin-top:12px}
.alt-cubuk{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(245,240,230,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--cizgi);padding:12px var(--g2) calc(12px + env(safe-area-inset-bottom,0px)) var(--g)}
.alt-cubuk .ic{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:48px}
.alt-cubuk .dugmeler{max-width:720px;width:100%;margin:0 auto;display:flex;gap:12px}
.alt-cubuk .btn{min-height:52px}.alt-cubuk .ana{flex:1}
.kagit{position:sticky;top:110px}
.kagit h2{font:700 15px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--murekkep3);margin:0 0 14px}
.izgara{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.izgara button{position:relative;min-height:48px;border-radius:12px;border:1.5px solid var(--cizgi);background:var(--yuzey);font:700 16px/1 var(--sans);color:var(--murekkep);cursor:pointer;font-variant-numeric:tabular-nums;transition:border-color var(--hiz),background-color var(--hiz)}
@media (hover:hover){.izgara button:hover{border-color:#9fb4ea}}
.izgara button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--krem),0 0 0 5px var(--mavi)}
.izgara button.c{background:var(--murekkep);color:#fff;border-color:var(--murekkep)}
.izgara button.d{background:var(--dogru-z);border-color:var(--dogru);color:var(--dogru)}
.izgara button.y{background:var(--yanlis-z);border-color:var(--yanlis);color:var(--yanlis)}
.izgara button.su{box-shadow:0 0 0 2px var(--krem),0 0 0 4px var(--mavi)}
.izgara button.m::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--isaret)}
.anahtar{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:16px 0 18px;font-size:14px;color:var(--murekkep2)}
.anahtar span{display:flex;align-items:center;gap:8px}.anahtar i{width:12px;height:12px;border-radius:4px;border:1.5px solid var(--cizgi);background:var(--yuzey)}
.anahtar i.c{background:var(--murekkep);border-color:var(--murekkep)}.anahtar i.d{background:var(--dogru-z);border-color:var(--dogru)}.anahtar i.y{background:var(--yanlis-z);border-color:var(--yanlis)}.anahtar i.m{border-radius:50%;background:var(--isaret);border-color:var(--isaret)}
.ozet{margin-top:18px;padding-top:16px;border-top:1px solid var(--cizgi);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.ozet b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.ozet span{font-size:13px;color:var(--murekkep3)}
.kagit .btn,#kagitSayfa .btn{width:100%;margin-top:16px}
.sayfa-ac{display:none}
dialog.sayfa{border:0;padding:0;margin:0;max-width:none;width:100%;position:fixed;inset:auto 0 0 0;border-radius:22px 22px 0 0;background:var(--krem);color:var(--murekkep);box-shadow:0 -20px 50px -20px rgba(13,27,51,.45)}
dialog.sayfa::backdrop{background:rgba(13,27,51,.35)}
dialog.sayfa .ic{padding:12px var(--g2) calc(20px + env(safe-area-inset-bottom,0px)) var(--g)}
dialog.sayfa .tutamac{width:44px;height:5px;border-radius:3px;background:var(--cizgi);margin:0 auto 14px}
dialog.sayfa .bas{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.kbd{font-size:13.5px;color:var(--murekkep3);margin-top:16px}
.kbd kbd{font:600 12px/1 var(--sans);border:1px solid var(--cizgi);border-bottom-width:2px;border-radius:5px;padding:3px 6px;background:var(--yuzey)}
@media (max-width:1100px){
  .duzen{grid-template-columns:minmax(0,1fr);padding-top:28px}
  .duzen>.kagit{display:none}
  .alt-cubuk .ic{grid-template-columns:minmax(0,1fr)}
  .sayfa-ac{display:inline-flex}
}
@media (max-width:640px){
  .ust-cubuk .w{min-height:56px;gap:6px}
  .baslik-k b{font-size:15px}.baslik-k>span{display:none}.baslik-k .adet{display:none}
  .isaret-b .yazi{display:none}.isaret-b{padding:0 12px}
  .cikis .yazi{display:none}
  .duzen{padding:20px 16px 130px}
  .parca{font-size:18px;padding:18px;margin-left:-4px;margin-right:-4px}
  .kok{font-size:18.5px}
  .secenek button{font-size:17px;min-height:58px;grid-template-columns:36px minmax(0,1fr) 22px;gap:12px;padding:10px 12px 10px 10px}
  .secenek .h{width:34px;height:34px}
  .alt-cubuk .dugmeler{gap:8px}.alt-cubuk .onceki .yazi{display:none}.alt-cubuk .onceki{padding:0 16px}
  .sayfa-ac .yazi{display:none}.sayfa-ac{padding:0 14px}
  .kbd{display:none}
}
</style>
</head>
<body>
<header class="ust-cubuk">
  <div class="w">
    <a class="btn metin kucuk cikis" href="../onizleme/index.html" aria-label="Çık ve konseptlere dön"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span class="yazi">Çık</span></a>
    <div class="baslik-k"><b>Karışık set<span class="sr"> ·</span> <span class="adet">· 10 soru</span></b><span>Örnek: gerçek soru bankasından</span></div>
    <span class="sure" id="sure" role="timer" aria-label="Geçen süre">00:00</span>
    <button type="button" class="btn ikincil kucuk isaret-b" id="isaret" aria-pressed="false"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span class="yazi">İşaretle</span></button>
    <button type="button" class="btn ikincil kucuk sayfa-ac" id="sayfaAc" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg><span class="yazi">Cevap kâğıdı</span></button>
  </div>
  <div class="ilerleme" id="ilerleme" aria-hidden="true"></div>
</header>
<div class="duzen">
  <main class="soru" id="soru" aria-live="polite"></main>
  <aside class="kagit" aria-labelledby="kagit-b" id="kagitMasa"></aside>
</div>
<div class="alt-cubuk"><div class="ic"><div class="dugmeler">
  <button type="button" class="btn ikincil onceki" id="onceki"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span class="yazi">Önceki</span></button>
  <button type="button" class="btn ana" id="ana">Cevabı kontrol et</button>
</div></div></div>
<dialog class="sayfa" id="sayfa" aria-labelledby="sayfa-b"><div class="ic"><div class="tutamac" aria-hidden="true"></div><div class="bas"><b id="sayfa-b">Cevap kâğıdı</b><button type="button" class="btn metin kucuk" id="sayfaKapat">Kapat</button></div><div id="kagitSayfa"></div></div></dialog>
<script>
const SORULAR = [{"s": "Türkçe", "t": "Paragraf", "d": 2, "p": "Bir dili öğrenmenin en etkili yolu, o dili günlük hayatın içinde kullanmaktır. Kelime listelerini ezberlemek bir başlangıç olabilir; ----. Bu yüzden öğrenciler, öğrendikleri sözcükleri cümle içinde kullanmaya özen göstermelidir.", "q": "Bu parçada boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?", "o": ["ancak kullanılmayan sözcükler kısa sürede unutulur", "dil öğrenmek yalnızca yeteneğe bağlıdır", "her dilin kendine özgü bir alfabesi vardır", "yabancı dil öğrenmek için yurt dışına gitmek gerekir", "dil bilgisi kuralları sözcüklerden daha önemlidir"], "a": 0, "x": "Boşluktan sonraki cümle, öğrencilerin sözcükleri kullanmaya özen göstermesini ister. Bu öneriyi \"kullanılmayan sözcük unutulur\" düşüncesi hazırlar."}, {"s": "Matematik", "t": "Önermeler", "d": 2, "p": "", "q": "p ⇒ q önermesine denk olan önerme aşağıdakilerden hangisidir?", "o": ["q ⇒ p", "p′ ⇒ q′", "q′ ⇒ p′", "p ∧ q", "p′ ∨ q′"], "a": 2, "x": "Bir koşullu önerme karşıt tersine denktir: p ⇒ q ≡ q′ ⇒ p′. Ayrıca p ⇒ q ≡ p′ ∨ q'dur; E seçeneği bu değildir."}, {"s": "Türkçe", "t": "Cümlede anlam", "d": 1, "p": "", "q": "Aşağıdaki cümlelerin hangisinde neden-sonuç ilişkisi vardır?", "o": ["Yağmur yağdığı için maç ertelendi.", "Yarın sabah erkenden yola çıkacağız.", "Kitabı okumak için kütüphaneye gitti.", "Akşam yemeğinden sonra yürüyüşe çıktık.", "Bu yıl kış çok sert geçti."], "a": 0, "x": "A'da maçın ertelenmesinin nedeni yağmurdur. C'deki \"okumak için\" bir amaç bildirir; bu amaç-sonuç ilişkisidir."}, {"s": "Fizik", "t": "Optik", "d": 1, "p": "", "q": "Düz aynada oluşan görüntü ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Görüntü sanaldır.", "Görüntü cisimle aynı boydadır.", "Görüntü gerçektir ve perdede toplanabilir.", "Görüntünün aynaya uzaklığı cismin uzaklığına eşittir.", "Görüntü düzdür."], "a": 2, "x": "Düz aynada görüntü sanaldır; ışınların uzantılarıyla oluştuğu için perdede toplanamaz."}, {"s": "Tarih", "t": "Kurtuluş Savaşı", "d": 1, "p": "", "q": "Mondros Ateşkes Antlaşması hangi yıl imzalanmıştır?", "o": ["1914", "1918", "1919", "1920", "1923"], "a": 1, "x": "Mondros Ateşkes Antlaşması 30 Ekim 1918'de imzalanmış ve Osmanlı Devleti için I. Dünya Savaşı sona ermiştir."}, {"s": "Matematik", "t": "Bölme ve bölünebilme", "d": 2, "p": "", "q": "120 sayısının asal olmayan pozitif bölenlerinin sayısı kaçtır?", "o": ["12", "13", "14", "15", "16"], "a": 1, "x": "120 = 2³ · 3 · 5 → pozitif bölen sayısı 4 · 2 · 2 = 16. Asal bölenler 2, 3, 5 olduğundan 16 − 3 = 13."}, {"s": "Biyoloji", "t": "Hücre", "d": 1, "p": "", "q": "Prokaryot hücrelerde aşağıdakilerden hangisi bulunmaz?", "o": ["Ribozom", "Hücre zarı", "DNA", "Çekirdek zarı", "Sitoplazma"], "a": 3, "x": "Prokaryotların zarla çevrili çekirdeği yoktur; DNA sitoplazmada bulunur."}, {"s": "Coğrafya", "t": "Türkiye'nin İklimi", "d": 1, "p": "", "q": "Aşağıdaki illerden hangisinde yıllık yağış miktarı en fazladır?", "o": ["Konya", "Rize", "Iğdır", "Şanlıurfa", "Ankara"], "a": 1, "x": "Rize, nemli hava kütlelerinin Doğu Karadeniz dağlarına çarpmasıyla Türkiye'nin en çok yağış alan ilidir."}, {"s": "Kimya", "t": "Kimyasal türler arası etkileşim", "d": 1, "p": "", "q": "NaCl bileşiğindeki bağın türü aşağıdakilerden hangisidir?", "o": ["Apolar kovalent", "Polar kovalent", "İyonik", "Metalik", "Hidrojen bağı"], "a": 2, "x": "Metal (Na) ile ametal (Cl) arasında elektron alışverişi olur; oluşan bağ iyonik bağdır."}, {"s": "İngilizce", "t": "Tenses", "d": 2, "p": "", "q": "By the time we arrived at the cinema, the film ----.", "o": ["had already started", "already starts", "has already started", "will have started", "is starting"], "a": 0, "x": "Geçmişteki bir olaydan (arrived) daha önce tamamlanmış eylem için past perfect kullanılır."}];
(function () {
  "use strict";
  const $ = s => document.querySelector(s), H = "ABCDE", N = SORULAR.length;
  const ZOR = { 1: "Kolay", 2: "Orta", 3: "Zor" };
  let D = { i: 0, sec: Array(N).fill(-1), kontrol: Array(N).fill(false), isaret: Array(N).fill(false), sn: 0 };
  try { const k = JSON.parse(localStorage.getItem("ake.ornekSet") || "null"); if (k && k.sec && k.sec.length === N) D = k; } catch (e) {}
  const kaydet = () => { try { localStorage.setItem("ake.ornekSet", JSON.stringify(D)); } catch (e) {} };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const IK = { d: '<svg class="ik" viewBox="0 0 24 24" fill="none" stroke="#17785f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>', y: '<svg class="ik" viewBox="0 0 24 24" fill="none" stroke="#b4324b" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' };
  function durumu(i) { if (D.kontrol[i]) return D.sec[i] === SORULAR[i].a ? "d" : "y"; return D.sec[i] >= 0 ? "c" : ""; }
  function kagitHTML() {
    const d = D.kontrol.filter((k, i) => k && D.sec[i] === SORULAR[i].a).length, y = D.kontrol.filter((k, i) => k && D.sec[i] !== SORULAR[i].a).length, b = N - d - y;
    return `<h2 id="kagit-b">Cevap kâğıdı</h2><div class="izgara">${SORULAR.map((q, i) => `<button type="button" data-git="${i}" class="${durumu(i)}${i === D.i ? " su" : ""}${D.isaret[i] ? " m" : ""}" aria-label="${i + 1}. soru${D.isaret[i] ? ", işaretli" : ""}${D.kontrol[i] ? (D.sec[i] === q.a ? ", doğru" : ", yanlış") : D.sec[i] >= 0 ? ", cevaplandı" : ""}"${i === D.i ? ' aria-current="true"' : ""}>${i + 1}</button>`).join("")}</div>
      <div class="anahtar"><span><i class="c"></i>Cevaplandı</span><span><i class="m"></i>İşaretli</span><span><i class="d"></i>Doğru</span><span><i class="y"></i>Yanlış</span></div>
      <div class="ozet"><div><b>${d}</b><span>doğru</span></div><div><b>${y}</b><span>yanlış</span></div><div><b>${b}</b><span>boş</span></div><div><b>${(d - y / 4).toLocaleString("tr-TR", { maximumFractionDigits: 2 })}</b><span>net</span></div></div>
      <a class="btn ikincil" href="https://akeakademi.com/#studyo">Gerçek sitede devam et</a>
      <p class="kbd"><kbd>A</kbd>–<kbd>E</kbd> şık seçer · <kbd>Enter</kbd> kontrol eder · <kbd>←</kbd><kbd>→</kbd> sorular arasında gezer · <kbd>İ</kbd> işaretler</p>`;
  }
  function ciz(odakla) {
    const q = SORULAR[D.i], kon = D.kontrol[D.i], s = D.sec[D.i];
    $("#soru").innerHTML = `<div class="meta"><span class="no">Soru ${D.i + 1} / ${N}</span><span>${esc(q.s)} · ${esc(q.t)}</span><span class="zor">${ZOR[q.d] || "Orta"}</span></div>
      ${q.p ? `<p class="parca">${esc(q.p)}</p>` : ""}<p class="kok" id="kok">${esc(q.q)}</p>
      <ol class="secenek" aria-labelledby="kok">${q.o.map((o, i) => `<li><button type="button" data-sec="${i}" aria-pressed="${s === i}" ${kon ? "disabled" : ""} class="${kon ? (i === q.a ? "dogru" : i === s ? "yanlis" : "") : ""}"><span class="h">${H[i]}</span><span>${esc(o)}</span>${kon && i === q.a ? IK.d : kon && i === s ? IK.y : "<span></span>"}</button></li>`).join("")}</ol>
      <div class="cozum${kon ? " on" : ""}">${kon ? `<div class="sonuc${s === q.a ? "" : " y"}"><i></i>${s === q.a ? "Doğru." : `Yanlış. Doğru cevap ${H[q.a]}.`}</div><p>${esc(q.x)}</p>${s !== q.a ? `<p class="not">Bu soru yanlış defterine eklendi; birkaç gün sonra tekrar karşına çıkar.</p>` : ""}` : ""}</div>`;
    $("#ilerleme").innerHTML = SORULAR.map((_, i) => `<i class="${i === D.i ? "s" : durumu(i)}"></i>`).join("");
    $("#kagitMasa").innerHTML = kagitHTML(); $("#kagitSayfa").innerHTML = kagitHTML().replace('id="kagit-b"', 'class="sr"');
    const ib = $("#isaret"); ib.setAttribute("aria-pressed", String(D.isaret[D.i])); ib.querySelector(".yazi").textContent = D.isaret[D.i] ? "İşaretli" : "İşaretle";
    $("#onceki").disabled = D.i === 0;
    const ana = $("#ana");
    if (!kon) { ana.textContent = "Cevabı kontrol et"; ana.disabled = s < 0; }
    else { ana.disabled = false; ana.textContent = D.i < N - 1 ? "Sonraki soru" : "Seti bitir"; }
    if (odakla) { const b = document.querySelector(".secenek button"); b && b.focus({ preventScroll: true }); scrollTo({ top: 0 }); }
    kaydet();
  }
  function git(i) { if (i < 0 || i >= N) return; D.i = i; ciz(true); }
  function kontrol() { if (D.sec[D.i] < 0 || D.kontrol[D.i]) return; const a = $("#ana"); a.setAttribute("aria-busy", "true"); setTimeout(() => { a.removeAttribute("aria-busy"); D.kontrol[D.i] = true; ciz(); const c = $(".cozum"); c && c.scrollIntoView({ block: "nearest", behavior: "smooth" }); }, 250); }
  document.addEventListener("click", e => {
    const s = e.target.closest("[data-sec]"); if (s && !s.disabled) { D.sec[D.i] = +s.dataset.sec; ciz(); document.querySelector(`[data-sec="${s.dataset.sec}"]`).focus({ preventScroll: true }); return; }
    const g = e.target.closest("[data-git]"); if (g) { const dlg = $("#sayfa"); if (dlg.open) dlg.close(); git(+g.dataset.git); }
  });
  $("#ana").addEventListener("click", () => { if (!D.kontrol[D.i]) kontrol(); else if (D.i < N - 1) git(D.i + 1); else { const dlg = $("#sayfa"); if (getComputedStyle($(".sayfa-ac")).display !== "none") dlg.showModal(); else $("#kagitMasa").scrollIntoView({ behavior: "smooth" }); } });
  $("#onceki").addEventListener("click", () => git(D.i - 1));
  $("#isaret").addEventListener("click", () => { D.isaret[D.i] = !D.isaret[D.i]; ciz(); });
  $("#sayfaAc").addEventListener("click", () => $("#sayfa").showModal());
  $("#sayfaKapat").addEventListener("click", () => $("#sayfa").close());
  $("#sayfa").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
  document.addEventListener("keydown", e => {
    if (e.target.closest("input,textarea") || e.metaKey || e.ctrlKey || $("#sayfa").open) return;
    const k = e.key.toLocaleUpperCase("tr-TR"), i = H.indexOf(k);
    if (i >= 0 && k.length === 1 && !D.kontrol[D.i]) { D.sec[D.i] = i; ciz(); }
    else if (e.key === "ArrowRight") git(D.i + 1); else if (e.key === "ArrowLeft") git(D.i - 1);
    else if (k === "İ" || k === "I") { D.isaret[D.i] = !D.isaret[D.i]; ciz(); }
    else if (e.key === "Enter" && !e.target.closest("button,a")) $("#ana").click();
  });
  setInterval(() => { if (document.hidden) return; D.sn++; $("#sure").textContent = String(Math.floor(D.sn / 60)).padStart(2, "0") + ":" + String(D.sn % 60).padStart(2, "0"); if (D.sn % 10 === 0) kaydet(); }, 1000);
  ciz();
})();
</script>
