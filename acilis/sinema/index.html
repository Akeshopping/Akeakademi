<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#28232c"><title>AKE Akademi açılışı</title>
<link rel="stylesheet" href="../ortak/ortak.css">
<script src="../ortak/renk.js"></script>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script>
<style>html,body{overflow:hidden;background:#28232c}.gecis{height:0!important}.ust{display:none}.marka-final{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;background:radial-gradient(70% 62% at 50% 46%,#3a3340 0%,#28232c 76%);opacity:0;transition:opacity .45s ease}
.marka-final::before{content:"";position:absolute;left:50%;top:46%;width:96vmin;height:96vmin;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(var(--ai-rgb,242,125,109),.22),rgba(var(--ai-rgb,242,125,109),0));pointer-events:none}
.marka-final.on{opacity:1}
.mf-in{display:flex;flex-direction:column;align-items:center;gap:clamp(20px,3.6vmin,40px);position:relative;transform:scale(.94);opacity:0;transition:transform 1.6s cubic-bezier(.2,.7,.2,1),opacity 1s ease .25s}
.marka-final.on .mf-in{transform:none;opacity:1}
.mf-logo{width:clamp(128px,42vmin,300px);height:auto;filter:drop-shadow(0 0 clamp(26px,5vmin,60px) rgba(var(--ai-rgb,242,125,109),.36))}
.mf-edge{stroke-dasharray:16 84;stroke-dashoffset:0;animation:mfEdge 2.2s linear .3s 1 both;opacity:.95;filter:drop-shadow(0 0 2px var(--ap,#fad6d0))}
@keyframes mfEdge{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
.mf-wm{font:700 clamp(30px,8vmin,64px)/1 "AKE Sans",system-ui,sans-serif;color:#f8f5f0;letter-spacing:-.005em;opacity:0;animation:mfW .9s ease .9s forwards}
.mf-in::after{content:"";width:clamp(96px,28vmin,240px);height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(var(--ai-rgb,242,125,109),0),var(--ai,#f27d6d),rgba(var(--ai-rgb,242,125,109),0));opacity:0;transform:scaleX(.2);animation:mfLine .9s ease 1.4s forwards}
@keyframes mfLine{to{opacity:.9;transform:none}}
.mf-wm span{font-weight:500;color:var(--ai,#f27d6d)}
@keyframes mfW{to{opacity:1}}
</style></head>
<body><canvas id="sahne" aria-hidden="true"></canvas>
<header class="ust" aria-hidden="true"></header>
<button type="button" class="atla">Animasyonu geç</button>
<main><section class="acilis" aria-hidden="true" style="min-height:0"></section><section class="gecis" aria-hidden="true"></section><section class="calisma" id="calisma" hidden></section></main>
<script type="module" src="../konseptler/4-esik-yasayan-bilgi-final/sahne.js"></script></body></html>
