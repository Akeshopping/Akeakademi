name: ake_akademi
description: AKE Akademi YKS çalışma uygulaması (Android ve iOS, tek kod tabanı).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  # Google Play Billing (Android) ve StoreKit (iOS) satın alma; yalnız mağaza abonelikleri (web/Shopier ödeme bağlantısı yok)
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Yazı tipleri sitedeki gömülü yazı tiplerinin (AKE Sans = Atkinson Hyperlegible Next, AKE Serif = Newsreader, AKE Rakam = Inter rakamları;
  # üçü de SIL Open Font License) statik örnekleridir. Yaklaşık logo kullanılmaz: K amblemi lib/ui/marka.dart içinde gerçek path ile çizilir.
  fonts:
    - family: AkeSans
      fonts:
        - asset: assets/fontlar/AkeSans-400.ttf
          weight: 400
        - asset: assets/fontlar/AkeSans-600.ttf
          weight: 600
        - asset: assets/fontlar/AkeSans-700.ttf
          weight: 700
    - family: AkeSerif
      fonts:
        - asset: assets/fontlar/AkeSerif-400.ttf
          weight: 400
        - asset: assets/fontlar/AkeSerif-600.ttf
          weight: 600
    - family: AkeRakam
      fonts:
        - asset: assets/fontlar/AkeRakam-400.ttf
          weight: 400
        - asset: assets/fontlar/AkeRakam-500.ttf
          weight: 500
        - asset: assets/fontlar/AkeRakam-600.ttf
          weight: 600
        - asset: assets/fontlar/AkeRakam-700.ttf
          weight: 700
